<!doctype html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night" data-board="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SolitaireNest · סוליטר</title>
<meta name="description" content="SolitaireNest — 13 משחקי סוליטר: קלונדייק, פריסל, עכביש, פירמידה ועוד. חלוקה יומית, מרוץ עם חבר, ביטול בלי הגבלה, רמזים ועובד בלי אינטרנט.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="SolitaireNest · סוליטר">
<meta property="og:description" content="13 משחקי סוליטר — קלונדייק, פריסל, עכביש ועוד — עם חלוקה יומית ומרוץ עם חבר.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  --felt1:#1f6b45; --felt2:#0f4029; --feltLine:rgba(255,255,255,.14); --feltInk:#f4f1e6;
  --cardFace:#fdfbf4; --cardEdge:#cfcac0; --red:#c4262e; --blk:#141414;
  --deck0:#1d4f9c; --deck1:#a8262e;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --cw:56px;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* table colour is its own setting (written after the themes, same specificity → it wins) */
[data-board="felt"]{--felt1:#1f6b45;--felt2:#0f4029;--feltInk:#f4f1e6;--feltLine:rgba(255,255,255,.14)}
[data-board="wood"]{--felt1:#8a5a32;--felt2:#5a3519;--feltInk:#fff6e8;--feltLine:rgba(255,235,200,.18)}
[data-board="blue"]{--felt1:#1d4f7a;--felt2:#0e2a45;--feltInk:#eef5ff;--feltLine:rgba(255,255,255,.14)}
[data-board="contrast"]{--felt1:#0c0c0c;--felt2:#000;--feltInk:#fff;--feltLine:rgba(255,255,255,.4);--cardEdge:#fff}
[data-board="theme"]{--felt1:var(--panel2);--felt2:var(--bg);--feltInk:var(--ink);--feltLine:var(--line)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hide{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;animation:scrIn .22s ease;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:block}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-family:var(--disp);font-weight:400;font-size:21px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:22px;font-weight:700;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:500;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.main{background:var(--acc);color:var(--accInk);font-weight:700}
.btn.ghosty{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.back:focus-visible,.ibtn:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:19px}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input.in,select.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:transparent;cursor:pointer;font-size:15px;padding:6px 4px}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:700}
.seg button:disabled{opacity:.35}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw .t{flex:1}
.sw .t small{display:block;color:var(--muted);font-size:13px}
.tg{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on .tg{background:var(--acc)}
.sw.on .tg::after{inset-inline-start:25px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.badge{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* ---------------- home ---------------- */
.home{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htop .tools{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.hero{position:relative;margin:16px 0 18px;padding:22px 18px 18px;border-radius:24px;background:radial-gradient(ellipse at 70% 120%,var(--felt1),var(--felt2) 78%);color:var(--feltInk);overflow:hidden;border:1px solid var(--feltLine);min-height:168px}
.hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:38px;line-height:1.05;position:relative}
.hero h1 small{display:block;font-size:20px;opacity:.85;margin-top:4px}
.hero p{margin:8px 0 0;opacity:.92;font-size:15px;position:relative;max-width:calc(100% - 132px)}
.hero .fan{position:absolute;inset-inline-end:10px;bottom:-22px;height:120px;width:130px;pointer-events:none}
.hero .fan .pc{position:absolute;bottom:0;left:50%;transform-origin:50% 120%;--w:56px}
.hero .hand{position:absolute;inset-inline-end:28px;top:14px;font-size:34px;transform:rotate(-12deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--acc);background:transparent;cursor:pointer;text-align:start;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mode .ic{font-size:28px;width:40px;text-align:center}
.mode b{display:block;font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.main{background:var(--acc);color:var(--accInk)}
.mode.main span{color:inherit;opacity:.8}
.minor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.minor button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.minor button i{font-style:normal;font-size:22px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------------- playing cards (CSS only) ---------------- */
.pc{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);background:var(--cardFace);border:1px solid var(--cardEdge);color:var(--blk);position:relative;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.35);font-family:var(--body);user-select:none;-webkit-user-select:none;overflow:hidden}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;top:calc(var(--w)*.04);left:calc(var(--w)*.06);font-weight:700;font-size:calc(var(--w)*.31);line-height:.92;text-align:center;letter-spacing:-.04em;z-index:1}
.pc .ix s{display:block;text-decoration:none;font-size:calc(var(--w)*.27)}
.pc .ix.b{top:auto;left:auto;bottom:calc(var(--w)*.04);right:calc(var(--w)*.06);transform:rotate(180deg)}
.pc.rx .ix:not(.b){left:auto;right:calc(var(--w)*.06)}
.pc.rx .ix.b{right:auto;left:calc(var(--w)*.06)}
.pc .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.6);padding-top:calc(var(--w)*.12)}
.pc .face{position:absolute;inset:calc(var(--w)*.26) calc(var(--w)*.2) calc(var(--w)*.2);border:1.5px solid currentColor;border-radius:calc(var(--w)*.08);display:grid;place-items:center;font-family:var(--disp);font-size:calc(var(--w)*.42);line-height:1;background:color-mix(in srgb,currentColor 7%,transparent)}
.pc .face i{display:block;font-style:normal;font-size:.55em;text-align:center}
.pc .dk{position:absolute;bottom:calc(var(--w)*.05);left:calc(var(--w)*.07);width:calc(var(--w)*.1);height:calc(var(--w)*.1);border-radius:50%;background:var(--deck0);opacity:.85}
.pc.rx .dk{left:auto;right:calc(var(--w)*.07)}
.pc.d1 .dk{background:var(--deck1)}
.pc.bk{background:repeating-linear-gradient(45deg,var(--bk) 0 4px,color-mix(in srgb,var(--bk) 72%,#fff) 4px 6px);border:2px solid #fff}
.pc.bk::after{content:"";position:absolute;inset:16%;border:1.5px solid rgba(255,255,255,.75);border-radius:30%}
.pc.bk.d0{--bk:var(--deck0)}.pc.bk.d1{--bk:var(--deck1)}
.pc.mini{--w:30px}

/* ---------------- game (solitaire table) ---------------- */
#game{background:radial-gradient(ellipse at 50% 45%,var(--felt1),var(--felt2) 85%);color:var(--feltInk);padding-top:0}
#game.on{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.28);flex:none}
.gtop .back{height:40px;min-width:44px;border-color:var(--feltInk);color:var(--feltInk)}
.gtop .ttl{flex:1;min-width:0;line-height:1.2}
.gtop .ttl b{font-family:var(--disp);font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .ibtn{width:40px;height:40px;background:rgba(0,0,0,.25);border-color:var(--feltLine);color:var(--feltInk)}
.gstats{display:flex;gap:12px;font-size:13px;opacity:.92;white-space:nowrap}
.gstats b{font-weight:600}
.tarea{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.sol{position:absolute;inset:0;direction:ltr}
.sol .pc,.sol .slot{position:absolute;margin:0}
.sol .slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);border:1.5px dashed var(--feltLine);display:grid;place-items:center;font-size:calc(var(--cw)*.42);color:var(--feltLine);font-family:var(--disp)}
.sol .slot[data-stock]{cursor:pointer;border-style:solid}
.sol .pc{--w:var(--cw);touch-action:none}
.sol .pc.pk{cursor:grab}
.sol .pc.lift{box-shadow:0 12px 24px rgba(0,0,0,.5);transition:none!important}
/* compact corner: rank and suit side by side, so a column of cards stays readable */
.sol .pc .ix:not(.b){display:flex;align-items:center;gap:1px;font-size:calc(var(--w)*.3);top:calc(var(--w)*.03);left:calc(var(--w)*.05);letter-spacing:-.05em}
.sol .pc .ix s{display:inline;font-size:calc(var(--w)*.26)}
.sol .pc .dk{display:none}
.sol .cnt{position:absolute;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;z-index:60;pointer-events:none}
.sol .tgt{box-shadow:0 0 0 3px var(--acc2),0 0 14px color-mix(in srgb,var(--acc2) 70%,transparent)!important}
.sol .slot.tgt{border-style:solid;border-color:var(--acc2)}
.sol .hintc{box-shadow:0 0 0 3px #46d07a,0 0 16px rgba(70,208,122,.8)!important;animation:hintP .7s ease-in-out 2}
@keyframes hintP{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.abar{display:flex;gap:8px;padding:6px 10px 8px;flex:none;background:rgba(0,0,0,.22)}
.abar .btn{flex:1;min-height:54px;padding:4px 6px;font-size:20px;line-height:1.05;color:var(--feltInk);border-color:var(--feltLine);flex-direction:column;gap:0}
.abar .btn small{font-size:11px;opacity:.85;font-weight:400}
.abar .btn.main{background:var(--acc);color:var(--accInk);border-color:var(--acc);animation:hintP 1s ease-in-out infinite}
.celeb{position:fixed;inset:0;z-index:70;width:100vw;height:100vh;cursor:pointer}
.nb{text-align:center;color:var(--acc);font-weight:700;margin:0 0 6px}
/* home */
.daily{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 16px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accInk);cursor:pointer;text-align:start;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.3);margin-bottom:12px}
.daily .ic{font-size:30px}.daily b{display:block;font-size:19px}.daily span{font-size:13px;opacity:.85}
.daily .stk{margin-inline-start:auto;font-weight:700;font-size:18px}
.daily.done{opacity:.85}
.games{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.rtabs button{flex:1 1 30%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}.rtabs button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:700}
.game{display:flex;align-items:center;gap:10px;min-height:78px;padding:10px 10px;border-radius:16px;border:1.5px solid var(--acc);background:var(--panel);cursor:pointer;text-align:start;color:var(--ink)}
.game .gi{width:58px;height:58px;position:relative;flex:none;--cw:30px}
.game .gi .pc{position:absolute;--w:30px;top:6px}
.game b{display:block;font-size:17px;font-family:var(--disp);font-weight:400;line-height:1.15}
.game .gt{min-width:0}
.game .gi{width:52px}
.game .gs{font-size:13px;color:var(--muted)}
.soon{margin:12px 2px 0;font-size:13px;color:var(--muted);text-align:center}
.hero .heroArt2{position:absolute;inset-inline-end:8px;bottom:-26px;width:150px;height:110px;pointer-events:none}
.hero .heroArt2 .pc{position:absolute;bottom:0;left:50%;transform-origin:50% 130%;--w:52px}
.hero p{max-width:none}
.hero .heroArt{display:block;width:min(86%,320px);margin:6px auto -12px;position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));pointer-events:none}
.hlogo{height:46px;width:auto;flex:1 1 auto;min-width:0;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.daily img.ic{width:48px;height:48px;object-fit:contain;flex:none}
.game .gimg{width:54px;height:54px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.gh{display:flex;align-items:center;gap:8px}.gh img{width:34px;height:34px;object-fit:contain}
/* ---------------- overlays ---------------- */
#ovs .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#ovs .box{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
#ovs .ov.center{align-items:center}
.ov h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:24px}
.res .big{font-family:var(--disp);font-size:30px;text-align:center;margin:4px 0 8px;color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.tbl th{font-weight:500;color:var(--muted)}
.tbl td:first-child{text-align:start}
.mscore{display:flex;justify-content:center;gap:18px;font-family:var(--disp);font-size:22px;margin:8px 0}
.mscore div{text-align:center}.mscore small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel);color:var(--ink);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw;text-align:center;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:40}
.bub{position:absolute;max-width:70vw;background:#fff;color:#111;padding:8px 12px;border-radius:16px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:bubIn .25s ease}
.bub small{display:block;font-size:11px;color:#666}
.bub.emo{background:transparent;box-shadow:none;font-size:46px;padding:0;animation:pop 1.2s ease}
@keyframes bubIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}30%{transform:scale(1.25)}60%{transform:scale(1)}100%{transform:translateY(-14px)}}
.rules h3{font-family:var(--disp);font-weight:400;margin:18px 0 6px}
.rules p,.rules li{font-size:15px}
.rules .ex{display:flex;gap:6px;direction:ltr;justify-content:center;margin:8px 0;--cw:40px}
.tut{text-align:center}
.tut .big{font-size:60px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.dragGhost{position:fixed;z-index:80;pointer-events:none}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ---- 1.1 art ---- */
.pc.bk{background:url(img/back-blue.webp) center/100% 100% no-repeat,var(--deck0);border:1px solid rgba(0,0,0,.45)}
.pc.bk.d1{background:url(img/back-red.webp) center/100% 100% no-repeat,var(--deck1)}
.pc.bk::after{display:none}

<script>
/* ---- sol.js ---- */
/* =====================================================================
   SolitaireNest — rules engines (pure, no DOM): Klondike · FreeCell · Spider · Pyramid · TriPeaks · Golf · Canfield · Yukon · Russian · Scorpion · Forty Thieves · Baker's Dozen · Clock
   Card id: copy*52 + suit*13 + rank  (suit 0..3 → ♠ ♥ ♦ ♣, rank 0 = A … 12 = K).
   A pile is an array, top at the END. Face-down cards are stored as -(id+1).
   State: { g, seed, opt, p: {pileName: [...]}, moves, score, passes, won }
   Every game exposes:
     deal(seed, opt) · names (pile order) · pickable(S, from, i) · canDrop(S, from, i, to)
     move(S, from, i, to) · stock(S) (tap on the stock; false = nothing to do) · won(S)
     hints(S) (best first) · safeUp(S) (one "safe" foundation move or null)
   ===================================================================== */
const SOL = (() => {
  const up = x => x >= 0, cid = x => x >= 0 ? x : -x - 1, down = c => -c - 1;
  const suit = c => ((cid(c) % 52) / 13) | 0, rank = c => cid(c) % 13, red = c => { const s = suit(c); return s === 1 || s === 2; };
  const top = a => a.length ? a[a.length - 1] : null;
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  const deck52 = () => Array.from({ length: 52 }, (_, i) => i);
  const R = n => Array.from({ length: n }, (_, i) => i);
  const kind = p => p[0];                                   // 's' stock · 'w' waste · 'f' foundation · 't' tableau · 'c' free cell
  const clone = S => JSON.parse(JSON.stringify(S));
  // a foundation that takes card c (single card, same suit, one up), or null
  function fFor(S, c, n) { for (let k = 0; k < n; k++) { const f = S.p['f' + k], t = top(f); if (t == null ? rank(c) === 0 : suit(t) === suit(c) && rank(t) === rank(c) - 1) return 'f' + k; } return null; }
  function fitsFound(S, to, c) { const f = S.p[to], t = top(f); return t == null ? rank(c) === 0 : suit(t) === suit(c) && rank(t) === rank(c) - 1; }
  // the classic "safe to send up" rule: nothing still on the table could need this card to build on
  function safe(S, c, nf) {
    if (rank(c) <= 1) return true;
    const h = [-1, -1, -1, -1];
    for (let k = 0; k < nf; k++) { const t = top(S.p['f' + k]); if (t != null) h[suit(t)] = Math.max(h[suit(t)], rank(t)); }
    const opp = red(c) ? [0, 3] : [1, 2];
    return Math.min(h[opp[0]], h[opp[1]]) >= rank(c) - 1;
  }

  /* ================= Klondike ================= */
  const K = {
    id: 'klondike', nf: 4,
    names: ['s', 'w', 'f0', 'f1', 'f2', 'f3', 't0', 't1', 't2', 't3', 't4', 't5', 't6'],
    deal(seed, opt) {
      opt = Object.assign({ draw: 1, limit: false, scoring: 'std' }, opt || {});
      const d = shuffle(deck52(), rng(seed)), p = { s: [], w: [] };
      for (let k = 0; k < 4; k++) p['f' + k] = [];
      for (let i = 0; i < 7; i++) { p['t' + i] = []; for (let j = 0; j <= i; j++) { const c = d.pop(); p['t' + i].push(j === i ? c : down(c)); } }
      p.s = d.map(down);
      return { g: 'klondike', seed, opt, p, moves: 0, score: opt.scoring === 'vegas' ? -52 : 0, passes: 0, won: false };
    },
    maxRecycles(S) { return !S.opt.limit ? Infinity : (S.opt.draw === 3 ? 2 : 0); },
    pickable(S, from, i) {
      const a = S.p[from]; if (!a || i < 0 || i >= a.length || !up(a[i])) return false;
      const k = kind(from);
      if (k === 'w' || k === 'f') return i === a.length - 1;
      return k === 't';
    },
    canDrop(S, from, i, to) {
      if (from === to || !K.pickable(S, from, i)) return false;
      const a = S.p[from], c = a[i], n = a.length - i, k = kind(to), d = S.p[to];
      if (k === 'f') return n === 1 && fitsFound(S, to, c);
      if (k === 't') { const t = top(d); if (t == null) return rank(c) === 12; return up(t) && red(t) !== red(c) && rank(t) === rank(c) + 1; }
      return false;
    },
    move(S, from, i, to) {
      const a = S.p[from], cs = a.splice(i), sc = S.opt.scoring, kf = kind(from), kt = kind(to);
      S.p[to].push(...cs.map(cid));
      if (sc === 'std') { if (kf === 'w' && kt === 't') S.score += 5; else if (kt === 'f' && kf !== 'f') S.score += 10; else if (kf === 'f' && kt === 't') S.score = Math.max(0, S.score - 15); }
      else if (sc === 'vegas') { if (kt === 'f' && kf !== 'f') S.score += 5; else if (kf === 'f' && kt !== 'f') S.score -= 5; }
      const nt = top(a); let flip = false;
      if (kf === 't' && nt != null && !up(nt)) { a[a.length - 1] = cid(nt); flip = true; if (sc === 'std') S.score += 5; }
      S.moves++; S.won = K.won(S); return { flip };
    },
    stock(S) {
      if (S.p.s.length) { const n = Math.min(S.opt.draw, S.p.s.length); for (let k = 0; k < n; k++) S.p.w.push(cid(S.p.s.pop())); S.moves++; return 'draw'; }
      if (S.p.w.length && S.passes < K.maxRecycles(S)) {
        S.p.s = S.p.w.reverse().map(down); S.p.w = []; S.passes++; S.moves++;
        if (S.opt.scoring === 'std' && S.opt.draw === 1) S.score = Math.max(0, S.score - 100);
        return 'recycle';
      }
      return false;
    },
    won: S => [0, 1, 2, 3].every(k => S.p['f' + k].length === 13),
    canFinish: S => !S.p.s.length && !S.p.w.length && R(7).every(i => S.p['t' + i].every(up)),
    srcs: S => ['w', ...R(7).map(i => 't' + i), ...R(4).map(k => 'f' + k)],
    dsts: S => [...R(4).map(k => 'f' + k), ...R(7).map(i => 't' + i)],
    safeUp(S) {
      for (const from of ['w', ...R(7).map(i => 't' + i)]) { const a = S.p[from], c = top(a); if (c == null || !up(c)) continue; const f = fFor(S, c, 4); if (f && safe(S, c, 4)) return { from, i: a.length - 1, to: f }; }
      return null;
    },
    hints(S) {
      const out = [], seen = new Set(), add = m => { const k = m.from + m.i + m.to; if (!seen.has(k)) { seen.add(k); out.push(m); } };
      // 1. up to the foundations
      for (const from of ['w', ...R(7).map(i => 't' + i)]) { const a = S.p[from], c = top(a); if (c != null && up(c)) { const f = fFor(S, c, 4); if (f) add({ from, i: a.length - 1, to: f }); } }
      // 2. moves that turn a face-down card (the whole face-up run), or empty a column for a king
      for (let x = 0; x < 7; x++) {
        const a = S.p['t' + x], i = a.findIndex(up); if (i < 0) continue;
        if (i === 0 && rank(a[0]) === 12) continue;          // a king already at the bottom: moving it is pointless
        for (let y = 0; y < 7; y++) if (y !== x && K.canDrop(S, 't' + x, i, 't' + y)) { if (!S.p['t' + y].length && i === 0) continue; add({ from: 't' + x, i, to: 't' + y }); break; }
      }
      // 3. waste to the table
      if (S.p.w.length) for (let y = 0; y < 7; y++) if (K.canDrop(S, 'w', S.p.w.length - 1, 't' + y)) { add({ from: 'w', i: S.p.w.length - 1, to: 't' + y }); break; }
      // 4. the stock
      if (S.p.s.length || (S.p.w.length && S.passes < K.maxRecycles(S))) out.push({ a: 'stock' });
      return out;
    }
  };

  /* ================= FreeCell ================= */
  const F = {
    id: 'freecell', nf: 4,
    names: ['c0', 'c1', 'c2', 'c3', 'f0', 'f1', 'f2', 'f3', 't0', 't1', 't2', 't3', 't4', 't5', 't6', 't7'],
    deal(seed, opt) {
      const d = shuffle(deck52(), rng(seed)), p = {};
      for (let k = 0; k < 4; k++) { p['c' + k] = []; p['f' + k] = []; }
      for (let i = 0; i < 8; i++) p['t' + i] = [];
      d.forEach((c, j) => p['t' + (j % 8)].push(c));
      return { g: 'freecell', seed, opt: opt || {}, p, moves: 0, score: 0, passes: 0, won: false };
    },
    seqOk(a, i) { for (let j = i; j < a.length - 1; j++) if (red(a[j]) === red(a[j + 1]) || rank(a[j]) !== rank(a[j + 1]) + 1) return false; return true; },
    cap(S, toEmpty) { const fc = R(4).filter(k => !S.p['c' + k].length).length; let ec = R(8).filter(i => !S.p['t' + i].length).length; if (toEmpty) ec--; return (fc + 1) * Math.pow(2, Math.max(0, ec)); },
    pickable(S, from, i) {
      const a = S.p[from]; if (!a || i < 0 || i >= a.length) return false;
      const k = kind(from); if (k === 'c') return i === 0; if (k === 'f') return false;
      return F.seqOk(a, i);
    },
    canDrop(S, from, i, to) {
      if (from === to || !F.pickable(S, from, i)) return false;
      const a = S.p[from], c = a[i], n = a.length - i, k = kind(to), d = S.p[to];
      if (k === 'f') return n === 1 && fitsFound(S, to, c);
      if (k === 'c') return n === 1 && !d.length;
      if (k === 't') { const t = top(d); if (n > F.cap(S, t == null)) return false; if (t == null) return true; return red(t) !== red(c) && rank(t) === rank(c) + 1; }
      return false;
    },
    move(S, from, i, to) { const cs = S.p[from].splice(i); S.p[to].push(...cs); S.moves++; S.won = F.won(S); return {}; },
    stock: () => false,
    won: S => [0, 1, 2, 3].every(k => S.p['f' + k].length === 13),
    canFinish(S) { const X = clone(S); for (let g = 0; g < 60; g++) { let m = null; for (const from of [...R(4).map(k => 'c' + k), ...R(8).map(i => 't' + i)]) { const c = top(X.p[from]); if (c == null) continue; const f = fFor(X, c, 4); if (f) { m = { from, to: f }; break; } } if (!m) break; X.p[m.to].push(X.p[m.from].pop()); } return F.won(X) && !F.won(S); },
    srcs: S => [...R(4).map(k => 'c' + k), ...R(8).map(i => 't' + i)],
    dsts: S => [...R(4).map(k => 'f' + k), ...R(8).map(i => 't' + i), ...R(4).map(k => 'c' + k)],
    safeUp(S) {
      for (const from of [...R(4).map(k => 'c' + k), ...R(8).map(i => 't' + i)]) { const a = S.p[from], c = top(a); if (c == null) continue; const f = fFor(S, c, 4); if (f && safe(S, c, 4)) return { from, i: a.length - 1, to: f }; }
      return null;
    },
    hints(S) {
      const out = [], add = m => out.push(m);
      for (const from of [...R(4).map(k => 'c' + k), ...R(8).map(i => 't' + i)]) { const a = S.p[from], c = top(a); if (c != null) { const f = fFor(S, c, 4); if (f) add({ from, i: a.length - 1, to: f }); } }
      // longest sequences onto a non-empty column first
      for (let x = 0; x < 8; x++) { const a = S.p['t' + x]; for (let i = 0; i < a.length; i++) { if (!F.seqOk(a, i)) continue; for (let y = 0; y < 8; y++) if (y !== x && S.p['t' + y].length && F.canDrop(S, 't' + x, i, 't' + y)) add({ from: 't' + x, i, to: 't' + y }); } }
      for (let k = 0; k < 4; k++) { const a = S.p['c' + k]; if (a.length) for (let y = 0; y < 8; y++) if (S.p['t' + y].length && F.canDrop(S, 'c' + k, 0, 't' + y)) add({ from: 'c' + k, i: 0, to: 't' + y }); }
      const ec = R(8).find(y => !S.p['t' + y].length);
      if (ec != null) for (let x = 0; x < 8; x++) { const a = S.p['t' + x]; if (a.length > 1) { let i = a.length - 1; while (i > 0 && F.seqOk(a, i - 1)) i--; if (i > 0 && F.canDrop(S, 't' + x, i, 't' + ec)) add({ from: 't' + x, i, to: 't' + ec }); } }
      const fc = R(4).find(k => !S.p['c' + k].length);
      if (fc != null) for (let x = 0; x < 8; x++) { const a = S.p['t' + x]; if (a.length > 1) add({ from: 't' + x, i: a.length - 1, to: 'c' + fc }); }
      return out;
    }
  };

  /* ================= Spider ================= */
  const P = {
    id: 'spider', nf: 8,
    names: ['s', 'f0', 'f1', 'f2', 'f3', 'f4', 'f5', 'f6', 'f7', 't0', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8', 't9'],
    deal(seed, opt) {
      opt = Object.assign({ suits: 1 }, opt || {});
      const ns = opt.suits === 4 ? 4 : opt.suits === 2 ? 2 : 1, copies = 8 / ns, cards = [];
      for (let k = 0; k < copies; k++) for (let s = 0; s < ns; s++) for (let r = 0; r < 13; r++) cards.push(k * 52 + s * 13 + r);
      const d = shuffle(cards, rng(seed)), p = { s: [] };

    pickable(S, from, i) { const a = S.p[from]; return !!a && kind(from) === 't' && i >= 0 && i < a.length && up(a[i]); },

  /* ================= Forty Thieves: two decks, 10 columns, same-suit building, one pass through the stock ================= */
  const FT = {
    id: 'fortythieves', nf: 8,
    names: ['s', 'w', ...R(8).map(k => 'f' + k), ...R(10).map(i => 't' + i)],
    deal(seed, opt) {
      const cards = []; for (let k = 0; k < 2; k++) for (let c = 0; c < 52; c++) cards.push(k * 52 + c);

    seqOk(a, i) { for (let j = i; j < a.length - 1; j++) if (suit(a[j]) !== suit(a[j + 1]) || rank(a[j]) !== rank(a[j + 1]) + 1) return false; return true; },

rulesRU:"<h3>המטרה</h3><p>להעביר את כל הקלפים ל<b>ארבע ערימות האסים</b>, לפי צורה מאס עד מלך.</p><h3>השולחן</h3><p>אותו סידור כמו ביוקון: 7 עמודות ובלי חפיסה. אבל בונים <b>בסדר יורד ובאותה צורה</b> — 9♥ רק על 10♥.</p><p>אפשר להזיז <b>כל קלף גלוי יחד עם כל הקלפים שמעליו</b>, גם אם הם לא מסודרים. עמודה ריקה מקבלת רק מלך.</p><p>💡 משחק קשה במיוחד — כדאי להשאיר את „רק חלוקות פתירות” דלוק.</p>",

rulesFT:"<h3>המטרה</h3><p>להעביר את כל 104 הקלפים ל<b>שמונה ערימות האסים</b>, לפי צורה מאס עד מלך.</p><h3>השולחן</h3><p>10 עמודות של 4 קלפים גלויים. בונים <b>בסדר יורד ובאותה צורה</b> ומזיזים <b>קלף אחד בכל פעם</b>. כשיש עמודות ריקות אפשר להזיז רצף שלם (כל עמודה ריקה מכפילה את האורך). עמודה ריקה מקבלת כל קלף.</p><h3>החפיסה</h3><p>הקשה הופכת קלף אחד. עוברים על החפיסה <b>פעם אחת בלבד</b> — אין סיבוב שני.</p>",

rulesK1:"<h3>Goal</h3><p>Move all 52 cards to the <b>four foundations</b> — each suit from Ace to King.</p><h3>The table</h3><p>7 columns. Build them <b>down in alternating colours</b>: a red 9 goes on a black 10. You can move a whole group of ordered cards. An empty column takes <b>only a King</b>.</p>",
rulesK2:"<h3>The stock</h3><p>Tap the stock to turn one card (or three). Only the top turned card is available. Stock used up? Tap it to turn the cards back and start a new pass (unless you chose limited passes).</p><h3>Standard scoring</h3><ul><li>Card from the stock to the table: 5</li><li>Card to the foundations: 10</li><li>Turning a face-down card: 5</li><li>Card from the foundations back to the table: -15</li><li>New pass through the stock (one card): -100</li><li>Time bonus at the end: the faster, the more points</li></ul><h3>Vegas</h3><p>Each deal costs 52 and every card sent up pays 5. The bank carries over between games (virtual only).</p>",
rulesF1:"<h3>Goal</h3><p>Move all cards to the <b>four foundations</b>, by suit from Ace to King. All cards are open from the start — it's all about planning.</p><h3>The table</h3><p>8 columns. Build <b>down in alternating colours</b>. At the top left are <b>4 free cells</b> — each holds one card. An empty column takes any card.</p>",
rulesF2:"<h3>Moving a group</h3><p>Officially you move one card at a time, but the app moves an ordered group at once if there's enough free space: (free cells + 1) × 2 to the power of the empty columns.</p><h3>Tips</h3><ul><li>Don't fill all the cells — they're your power.</li><li>An empty column is worth more than a free cell.</li><li>Free the aces and twos first.</li></ul>",
rulesS1:"<h3>Goal</h3><p>Build <b>8 full runs</b> from King to Ace <b>in one suit</b>. A full run leaves the table by itself.</p><h3>The table</h3><p>10 columns, two decks. A card can go on a card one higher — <b>any suit</b>. But you can only move a group when it is <b>one suit</b> and in order. An empty column takes any card or group.</p>",
rulesS2:"<h3>The stock</h3><p>Tap the stock to deal one card to every column (5 times per game). You can't deal while a column is empty.</p><h3>Scoring</h3><p>You start at 500. Every move costs 1, and every full run adds 100.</p><h3>Tips</h3><ul><li>Build in the same suit whenever you can.</li><li>Turn face-down cards as early as possible.</li><li>An empty column is an asset — don't fill it for nothing.</li></ul>",

rulesY:"<h3>Goal</h3><p>Clear the whole <b>pyramid</b> (28 cards).</p><h3>How</h3><p>Remove a <b>pair of cards that adds up to 13</b>: Ace=1, Jack=11, Queen=12. For example 6+7, 4+9, Queen+Ace. A <b>King</b> (13) goes alone.</p><p>Only a card that <b>no other card covers</b> is available. You can also pair with the top card of the pile next to the stock.</p><p>Tap a card to remove it with its best partner. Want to choose? Drag it onto the partner.</p><h3>The stock</h3><p>Tap to turn a card. You can go through the stock <b>three times</b>.</p>",
rulesTP:"<h3>Goal</h3><p>Clear the <b>three peaks</b> (28 cards).</p><h3>How</h3><p>Move a card <b>one up or one down</b> from the open pile onto it, any suit. King and Ace connect. A card opens when no cards cover it.</p><p>No move? Tap the stock to turn a new card (one pass only).</p><h3>Scoring</h3><p>Each card in a run is worth more: the first 1, the second 2, the third 3... A card from the stock resets the run. Clearing all peaks: 50 bonus.</p>",
rulesGO:"<h3>Goal</h3><p>Clear the <b>seven columns</b> (35 cards, all face up).</p><h3>How</h3><p>Move the <b>bottom</b> card of a column onto the pile if it is <b>one up or one down</b> from the pile's card, any suit. <b>Nothing goes on a King</b>, and King and Ace don't connect.</p><p>No move? Tap the stock to turn a card (one pass only).</p><h3>Scoring</h3><p>Like golf — the lower the better. Your score is the number of cards left on the table.</p>",
rulesCF:"<h3>Goal</h3><p>Move all cards to the <b>four foundations</b>.</p><h3>Setup</h3><p>A <b>reserve</b> of 13 cards (only the top one open), 4 columns, and one card turned onto the first foundation — <b>it sets the starting rank</b>. If it's a 7, every foundation starts at 7 and goes up: 7, 8... King, Ace, 2... up to 6.</p><h3>The table</h3><p>Build <b>down in alternating colours</b>; after an Ace comes a King. A column that empties is refilled from the reserve by itself. Once the reserve is gone, any card can go into an empty column.</p><h3>The stock</h3><p>Turn three (or one), with unlimited passes.</p>",
rulesYU:"<h3>Goal</h3><p>Move all cards to the <b>four foundations</b>, by suit from Ace to King.</p><h3>The table</h3><p>7 columns like Klondike, but <b>no stock</b> — every card is already on the table. Build <b>down in alternating colours</b>.</p><p>The twist: you can move <b>any face-up card together with all the cards on top of it</b> — even if they're not in order. An empty column takes only a King (with whatever is on it).</p>",

rulesRU:"<h3>Goal</h3><p>Move all cards to the <b>four foundations</b>, by suit from Ace to King.</p><h3>The table</h3><p>The same layout as Yukon: 7 columns and no stock. But you build <b>down in the same suit</b> — 9♥ only on 10♥.</p><p>You can move <b>any face-up card together with all the cards on top of it</b>, even if they're not in order. An empty column takes only a King.</p><p>💡 A very hard game — keep “Winnable deals only” on.</p>",
rulesSC:"<h3>Goal</h3><p>Build <b>four complete runs</b> on the table — King down to Ace in one suit. A finished run goes up by itself.</p><h3>Setup</h3><p>7 columns of 7 cards. In the first four columns the three bottom cards are face down. Three more cards wait in the stock.</p><h3>The table</h3><p>A card goes only on the card <b>one higher in the same suit</b>. As in Yukon, you can move <b>any face-up card with everything on it</b>. An empty column takes only a King.</p><h3>The three cards</h3><p>Tap the stock to deal them onto the first three columns — once only.</p>",
rulesFT:"<h3>Goal</h3><p>Move all 104 cards to the <b>eight foundations</b>, by suit from Ace to King.</p><h3>The table</h3><p>10 columns of 4 face-up cards. Build <b>down in the same suit</b>, moving <b>one card at a time</b>. With empty columns you can move a whole run (each empty column doubles the length). An empty column takes any card.</p><h3>The stock</h3><p>Tap to turn one card. You go through the stock <b>only once</b> — no second round.</p>",
rulesBD:"<h3>Goal</h3><p>Move all cards to the <b>four foundations</b>, by suit from Ace to King.</p><h3>The table</h3><p>13 columns of 4 cards, all face up. On the deal <b>Kings sink to the bottom</b> of their column.</p><p>Build <b>down regardless of suit</b>, moving only the top card. <b>A column that empties stays empty</b> — it can't be filled.</p><p>💡 Start with the columns where the Aces are buried least deep.</p>",
rulesCL:"<h3>Goal</h3><p>Turn all 52 cards face up before the fourth King comes out.</p><h3>Setup</h3><p>12 piles around a clock — Ace at one o'clock, 2 at two o'clock and so on up to the Queen at twelve — and the Kings' pile in the middle. Each pile has 4 face-down cards.</p><h3>Play</h3><p>The first card comes from the middle. Put it <b>under the pile of its number</b> (tap the card or the pile), and the next card comes from there. Keep going until the fourth King goes in.</p><p>There are no decisions — it's pure luck, and roughly one game in 13 comes out. <b>▶ Auto play</b> runs it all.</p>",

rulesK1:"<h3>Цель</h3><p>Переместите все 52 карты на <b>четыре базы</b> — каждую масть от туза до короля.</p><h3>Стол</h3><p>7 столбцов. Стройте их <b>по убыванию, чередуя цвета</b>: красная 9 кладётся на чёрную 10. Можно перемещать целую упорядоченную группу карт. В пустой столбец можно положить <b>только короля</b>.</p>",
rulesK2:"<h3>Колода</h3><p>Коснитесь колоды, чтобы открыть одну карту (или три). Доступна только верхняя открытая карта. Колода закончилась? Коснитесь её, чтобы перевернуть карты и начать новый проход (если вы не выбрали ограниченные проходы).</p><h3>Стандартный подсчёт</h3><ul><li>Карта из колоды на стол: 5</li><li>Карта на базы: 10</li><li>Открытие закрытой карты: 5</li><li>Карта с баз обратно на стол: -15</li><li>Новый проход по колоде (одна карта): -100</li><li>Бонус за время в конце: чем быстрее, тем больше очков</li></ul><h3>Вегас</h3><p>Каждая раздача стоит 52, а каждая карта на базах приносит 5. Банк переходит из игры в игру (только виртуально).</p>",
rulesF1:"<h3>Цель</h3><p>Переместите все карты на <b>четыре базы</b>, по мастям от туза до короля. Все карты открыты с самого начала — всё решает планирование.</p><h3>Стол</h3><p>8 столбцов. Стройте <b>по убыванию, чередуя цвета</b>. Слева вверху — <b>4 свободные ячейки</b>, в каждой по одной карте. В пустой столбец можно положить любую карту.</p>",
rulesF2:"<h3>Перемещение группы</h3><p>По правилам карты переносятся по одной, но приложение перемещает упорядоченную группу сразу, если хватает свободного места: (свободные ячейки + 1) × 2 в степени числа пустых столбцов.</p><h3>Советы</h3><ul><li>Не заполняйте все ячейки — в них ваша сила.</li><li>Пустой столбец ценнее свободной ячейки.</li><li>Сначала освобождайте тузы и двойки.</li></ul>",
rulesS1:"<h3>Цель</h3><p>Соберите <b>8 полных рядов</b> от короля до туза <b>одной масти</b>. Полный ряд сам уходит со стола.</p><h3>Стол</h3><p>10 столбцов, две колоды. Карту можно положить на карту на единицу старше — <b>любой масти</b>. Но группу можно перемещать, только если она <b>одной масти</b> и по порядку. В пустой столбец можно положить любую карту или группу.</p>",
rulesS2:"<h3>Колода</h3><p>Коснитесь колоды, чтобы сдать по одной карте в каждый столбец (5 раз за игру). Нельзя сдавать, пока есть пустой столбец.</p><h3>Очки</h3><p>Вы начинаете с 500. Каждый ход стоит 1, а каждый полный ряд добавляет 100.</p><h3>Советы</h3><ul><li>По возможности стройте в одной масти.</li><li>Открывайте закрытые карты как можно раньше.</li><li>Пустой столбец — это ценность, не занимайте его зря.</li></ul>",
rulesCommon:"<h3>В каждой игре</h3><ul><li><b>Коснитесь</b> карты, чтобы отправить её в лучшее место.</li><li><b>Перетащите</b>, если хотите выбрать сами. Карта встанет на ближайшее допустимое место.</li><li><b>↶ Отмена</b> без ограничений, <b>💡 Подсказка</b>, если вы застряли.</li><li><b>✨ Завершить</b> появляется, когда игра уже решена.</li></ul>",

rulesY:"<h3>Цель</h3><p>Разберите всю <b>пирамиду</b> (28 карт).</p><h3>Как играть</h3><p>Убирайте <b>пару карт, которые в сумме дают 13</b>: туз=1, валет=11, дама=12. Например, 6+7, 4+9, дама+туз. <b>Король</b> (13) уходит один.</p><p>Доступна только карта, которую <b>не накрывает ни одна другая</b>. Пару можно составить и с верхней картой стопки рядом с колодой.</p><p>Коснитесь карты, чтобы убрать её с лучшей парой. Хотите выбрать сами? Перетащите её на пару.</p><h3>Колода</h3><p>Коснитесь, чтобы открыть карту. Колоду можно пройти <b>три раза</b>.</p>",

rulesGO:"<h3>Цель</h3><p>Разберите <b>семь столбцов</b> (35 карт, все открыты).</p><h3>Как играть</h3><p>Переложите <b>нижнюю</b> карту столбца на стопку, если она <b>на единицу старше или младше</b> карты на стопке, любой масти. <b>На короля ничего не кладётся</b>, а король и туз не соединяются.</p><p>Нет хода? Коснитесь колоды, чтобы открыть карту (только один проход).</p><h3>Очки</h3><p>Как в гольфе — чем меньше, тем лучше. Ваш результат — число карт, оставшихся на столе.</p>",

rulesRU:"<h3>Цель</h3><p>Переложить все карты на <b>четыре базы</b> по мастям, от туза до короля.</p><h3>Стол</h3><p>Та же раскладка, что в Юконе: 7 столбцов и нет колоды. Но строить нужно <b>по убыванию в той же масти</b> — 9♥ только на 10♥.</p><p>Можно переносить <b>любую открытую карту вместе со всеми картами на ней</b>, даже если они не по порядку. В пустой столбец кладётся только король.</p><p>💡 Очень трудная игра — оставьте включённым «Только решаемые раздачи».</p>",
rulesSC:"<h3>Цель</h3><p>Собрать на столе <b>четыре полных ряда</b> — от короля до туза в одной масти. Готовый ряд уходит наверх сам.</p><h3>Раскладка</h3><p>7 столбцов по 7 карт. В первых четырёх столбцах три нижние карты лежат рубашкой вверх. Ещё 3 карты ждут в колоде.</p><h3>Стол</h3><p>Карту можно положить только на карту <b>на единицу старше той же масти</b>. Как в Юконе, можно переносить <b>любую открытую карту со всем, что на ней</b>. В пустой столбец кладётся только король.</p><h3>Три карты</h3><p>Нажмите на колоду, чтобы разложить их на первые три столбца — только один раз.</p>",
rulesFT:"<h3>Цель</h3><p>Переложить все 104 карты на <b>восемь баз</b> по мастям, от туза до короля.</p><h3>Стол</h3><p>10 столбцов по 4 открытые карты. Стройте <b>по убыванию в той же масти</b>, перенося <b>по одной карте</b>. При пустых столбцах можно перенести целый ряд (каждый пустой столбец удваивает длину). В пустой столбец можно положить любую карту.</p><h3>Колода</h3><p>Нажатие открывает одну карту. Колоду проходят <b>только один раз</b> — второго круга нет.</p>",
rulesBD:"<h3>Цель</h3><p>Переложить все карты на <b>четыре базы</b> по мастям, от туза до короля.</p><h3>Стол</h3><p>13 столбцов по 4 карты, все открыты. При раздаче <b>короли уходят на дно</b> своего столбца.</p><p>Стройте <b>по убыванию независимо от масти</b>, перенося только верхнюю карту. <b>Опустевший столбец остаётся пустым</b> — заполнить его нельзя.</p><p>💡 Начинайте со столбцов, где тузы лежат ближе всего к верху.</p>",
rulesCL:"<h3>Цель</h3><p>Открыть все 52 карты до того, как выйдет четвёртый король.</p><h3>Раскладка</h3><p>12 стопок по кругу циферблата — туз на часе 1, двойка на часе 2 и так далее до дамы на 12 — и стопка королей в центре. В каждой стопке 4 закрытые карты.</p><h3>Игра</h3><p>Первая карта берётся из центра. Положите её <b>под стопку её номера</b> (нажмите на карту или на стопку) — оттуда придёт следующая карта. Продолжайте, пока не ляжет четвёртый король.</p><p>Решений здесь нет — это чистая удача, и сходится примерно одна игра из 13. <b>▶ Автоигра</b> разыграет всё сама.</p>",

rulesK1:"<h3>Objetivo</h3><p>Lleva las 52 cartas a las <b>cuatro fundaciones</b> — cada palo del As al Rey.</p><h3>La mesa</h3><p>7 columnas. Constrúyelas <b>en orden descendente alternando colores</b>: un 9 rojo va sobre un 10 negro. Puedes mover un grupo entero de cartas ordenadas. En una columna vacía <b>solo cabe un Rey</b>.</p>",
rulesK2:"<h3>El mazo</h3><p>Toca el mazo para voltear una carta (o tres). Solo está disponible la carta volteada de arriba. ¿Se acabó el mazo? Tócalo para dar la vuelta a las cartas y empezar una nueva pasada (salvo que elegiste pasadas limitadas).</p><h3>Puntuación estándar</h3><ul><li>Carta del mazo a la mesa: 5</li><li>Carta a las fundaciones: 10</li><li>Voltear una carta boca abajo: 5</li><li>Carta de las fundaciones de vuelta a la mesa: -15</li><li>Nueva pasada por el mazo (una carta): -100</li><li>Bono de tiempo al final: cuanto más rápido, más puntos</li></ul><h3>Vegas</h3><p>Cada partida cuesta 52 y cada carta enviada a las fundaciones paga 5. La banca se mantiene entre partidas (solo virtual).</p>",
rulesF1:"<h3>Objetivo</h3><p>Lleva todas las cartas a las <b>cuatro fundaciones</b>, por palo del As al Rey. Todas las cartas están a la vista desde el principio — todo depende de la planificación.</p><h3>La mesa</h3><p>8 columnas. Construye <b>en orden descendente alternando colores</b>. Arriba a la izquierda hay <b>4 celdas libres</b> — cada una guarda una carta. En una columna vacía cabe cualquier carta.</p>",
rulesF2:"<h3>Mover un grupo</h3><p>Oficialmente se mueve una carta a la vez, pero la app mueve un grupo ordenado de una vez si hay suficiente espacio libre: (celdas libres + 1) × 2 elevado al número de columnas vacías.</p><h3>Consejos</h3><ul><li>No llenes todas las celdas — son tu fuerza.</li><li>Una columna vacía vale más que una celda libre.</li><li>Libera primero los ases y los doses.</li></ul>",
rulesS1:"<h3>Objetivo</h3><p>Forma <b>8 escaleras completas</b> del Rey al As <b>de un mismo palo</b>. Una escalera completa sale de la mesa sola.</p><h3>La mesa</h3><p>10 columnas, dos barajas. Una carta puede ir sobre otra un punto mayor — <b>de cualquier palo</b>. Pero solo puedes mover un grupo si es <b>de un mismo palo</b> y está en orden. En una columna vacía cabe cualquier carta o grupo.</p>",
rulesS2:"<h3>El mazo</h3><p>Toca el mazo para repartir una carta en cada columna (5 veces por partida). No puedes repartir con una columna vacía.</p><h3>Puntuación</h3><p>Empiezas con 500. Cada movimiento cuesta 1 y cada escalera completa suma 100.</p><h3>Consejos</h3><ul><li>Construye en el mismo palo siempre que puedas.</li><li>Voltea las cartas boca abajo lo antes posible.</li><li>Una columna vacía es un tesoro — no la llenes porque sí.</li></ul>",
rulesCommon:"<h3>En todos los juegos</h3><ul><li><b>Toca</b> una carta para enviarla al mejor lugar.</li><li><b>Arrastra</b> cuando quieras elegir. La carta se coloca en el sitio válido más cercano.</li><li><b>↶ Deshacer</b> sin límites, <b>💡 Pista</b> cuando te atasques.</li><li><b>✨ Terminar</b> aparece cuando la partida ya está resuelta.</li></ul>",

rulesY:"<h3>Objetivo</h3><p>Despeja toda la <b>pirámide</b> (28 cartas).</p><h3>Cómo</h3><p>Retira una <b>pareja de cartas que sume 13</b>: As=1, Jota=11, Reina=12. Por ejemplo 6+7, 4+9, Reina+As. Un <b>Rey</b> (13) sale solo.</p><p>Solo está disponible una carta que <b>ninguna otra cubre</b>. También puedes emparejar con la carta de arriba de la pila junto al mazo.</p><p>Toca una carta para retirarla con su mejor pareja. ¿Quieres elegir? Arrástrala sobre la pareja.</p><h3>El mazo</h3><p>Toca para voltear una carta. Puedes recorrer el mazo <b>tres veces</b>.</p>",
rulesTP:"<h3>Objetivo</h3><p>Despeja los <b>tres picos</b> (28 cartas).</p><h3>Cómo</h3><p>Pasa a la pila abierta una carta <b>uno más o uno menos</b> que la de arriba, de cualquier palo. El Rey y el As se conectan. Una carta se abre cuando ninguna otra la cubre.</p><p>¿Sin jugadas? Toca el mazo para voltear una carta nueva (una sola pasada).</p><h3>Puntuación</h3><p>Cada carta de una racha vale más: la primera 1, la segunda 2, la tercera 3... Una carta del mazo reinicia la racha. Despejar todos los picos: 50 de bono.</p>",
rulesGO:"<h3>Objetivo</h3><p>Despeja las <b>siete columnas</b> (35 cartas, todas boca arriba).</p><h3>Cómo</h3><p>Pasa a la pila la carta de <b>abajo</b> de una columna si es <b>uno más o uno menos</b> que la carta de la pila, de cualquier palo. <b>Sobre un Rey no va nada</b>, y el Rey y el As no se conectan.</p><p>¿Sin jugadas? Toca el mazo para voltear una carta (una sola pasada).</p><h3>Puntuación</h3><p>Como en el golf — cuanto menos, mejor. Tu puntuación es el número de cartas que quedan en la mesa.</p>",
rulesCF:"<h3>Objetivo</h3><p>Lleva todas las cartas a las <b>cuatro fundaciones</b>.</p><h3>Preparación</h3><p>Una <b>reserva</b> de 13 cartas (solo la de arriba a la vista), 4 columnas y una carta volteada en la primera fundación — <b>ella marca el valor inicial</b>. Si es un 7, cada fundación empieza en 7 y sube: 7, 8... Rey, As, 2... hasta 6.</p><h3>La mesa</h3><p>Construye <b>en orden descendente alternando colores</b>; después del As viene el Rey. Una columna que se vacía se rellena sola desde la reserva. Cuando se acaba la reserva, cualquier carta puede ir a una columna vacía.</p><h3>El mazo</h3><p>Voltea de tres en tres (o de una en una), con pasadas ilimitadas.</p>",
rulesYU:"<h3>Objetivo</h3><p>Lleva todas las cartas a las <b>cuatro fundaciones</b>, por palo del As al Rey.</p><h3>La mesa</h3><p>7 columnas como en Klondike, pero <b>sin mazo</b> — todas las cartas ya están en la mesa. Construye <b>en orden descendente alternando colores</b>.</p><p>La novedad: puedes mover <b>cualquier carta boca arriba junto con todas las cartas que tiene encima</b> — aunque no estén en orden. En una columna vacía solo cabe un Rey (con lo que tenga encima).</p>",

rulesRU:"<h3>Objetivo</h3><p>Llevar todas las cartas a las <b>cuatro bases</b>, por palo del As al Rey.</p><h3>La mesa</h3><p>La misma disposición que Yukon: 7 columnas y sin mazo. Pero se construye <b>en orden descendente y del mismo palo</b>: el 9♥ solo sobre el 10♥.</p><p>Puedes mover <b>cualquier carta descubierta junto con todas las que tiene encima</b>, aunque no estén en orden. Una columna vacía solo admite un Rey.</p><p>💡 Un juego muy difícil: deja activado «Solo partidas ganables».</p>",
rulesSC:"<h3>Objetivo</h3><p>Formar en la mesa <b>cuatro escaleras completas</b>: del Rey al As de un mismo palo. Una escalera terminada sube sola.</p><h3>Disposición</h3><p>7 columnas de 7 cartas. En las cuatro primeras columnas, las tres cartas de abajo están boca abajo. Otras 3 cartas esperan en el mazo.</p><h3>La mesa</h3><p>Una carta solo va sobre la carta <b>un punto mayor del mismo palo</b>. Como en Yukon, puedes mover <b>cualquier carta descubierta con todo lo que tiene encima</b>. Una columna vacía solo admite un Rey.</p><h3>Las tres cartas</h3><p>Toca el mazo para repartirlas sobre las tres primeras columnas — solo una vez.</p>",

rulesK1:"<h3>الهدف</h3><p>انقل كل الأوراق الـ52 إلى <b>الأساسات الأربعة</b> — كل نوع من الآص إلى الملك.</p><h3>الطاولة</h3><p>7 أعمدة. رتّبها <b>تنازليًا بألوان متناوبة</b>: 9 حمراء توضع على 10 سوداء. يمكنك نقل مجموعة كاملة من الأوراق المرتبة. العمود الفارغ يقبل <b>الملك فقط</b>.</p>",
rulesK2:"<h3>الرزمة</h3><p>المس الرزمة لسحب ورقة واحدة (أو ثلاث). الورقة العليا المكشوفة فقط متاحة. انتهت الرزمة؟ المسها لقلب الأوراق وبدء دورة جديدة (إلا إذا اخترت دورات محدودة).</p><h3>النقاط القياسية</h3><ul><li>ورقة من الرزمة إلى الطاولة: 5</li><li>ورقة إلى الأساسات: 10</li><li>كشف ورقة مقلوبة: 5</li><li>ورقة من الأساسات عائدة إلى الطاولة: -15</li><li>دورة جديدة عبر الرزمة (ورقة واحدة): -100</li><li>مكافأة الوقت في النهاية: كلما كنت أسرع، زادت النقاط</li></ul><h3>فيغاس</h3><p>كل توزيعة تكلّف 52 وكل ورقة تُرسل إلى الأساسات تربح 5. الرصيد ينتقل بين الألعاب (افتراضي فقط).</p>",
rulesF1:"<h3>الهدف</h3><p>انقل كل الأوراق إلى <b>الأساسات الأربعة</b>، حسب النوع من الآص إلى الملك. كل الأوراق مكشوفة منذ البداية — الأمر كله تخطيط.</p><h3>الطاولة</h3><p>8 أعمدة. رتّب <b>تنازليًا بألوان متناوبة</b>. في أعلى اليسار <b>4 خلايا فارغة</b> — كل منها تتسع لورقة واحدة. العمود الفارغ يقبل أي ورقة.</p>",
rulesF2:"<h3>نقل مجموعة</h3><p>رسميًا تُنقل ورقة واحدة في كل مرة، لكن التطبيق ينقل مجموعة مرتبة دفعة واحدة إذا توفرت مساحة كافية: (الخلايا الفارغة + 1) × 2 أُس عدد الأعمدة الفارغة.</p><h3>نصائح</h3><ul><li>لا تملأ كل الخلايا — فهي مصدر قوتك.</li><li>العمود الفارغ أثمن من خلية فارغة.</li><li>حرّر الآصات والاثنينات أولًا.</li></ul>",
rulesS1:"<h3>الهدف</h3><p>كوّن <b>8 تسلسلات كاملة</b> من الملك إلى الآص <b>من نوع واحد</b>. التسلسل الكامل يغادر الطاولة وحده.</p><h3>الطاولة</h3><p>10 أعمدة، مجموعتا أوراق. يمكن وضع الورقة على ورقة أعلى منها بدرجة — <b>من أي نوع</b>. لكن لا يمكنك نقل مجموعة إلا إذا كانت <b>من نوع واحد</b> ومرتبة. العمود الفارغ يقبل أي ورقة أو مجموعة.</p>",
rulesS2:"<h3>الرزمة</h3><p>المس الرزمة لتوزيع ورقة على كل عمود (5 مرات في كل لعبة). لا يمكنك التوزيع وهناك عمود فارغ.</p><h3>النقاط</h3><p>تبدأ بـ 500. كل حركة تكلّف 1، وكل تسلسل كامل يضيف 100.</p><h3>نصائح</h3><ul><li>رتّب من النوع نفسه كلما أمكن.</li><li>اكشف الأوراق المقلوبة في أقرب وقت.</li><li>العمود الفارغ ثروة — لا تملأه بلا سبب.</li></ul>",
rulesCommon:"<h3>في كل لعبة</h3><ul><li><b>المس</b> ورقة لإرسالها إلى أفضل مكان.</li><li><b>اسحب</b> عندما تريد الاختيار. تستقر الورقة في أقرب مكان مسموح.</li><li><b>↶ تراجع</b> بلا حدود، و<b>💡 تلميح</b> عندما تعلق.</li><li><b>✨ إنهاء</b> يظهر عندما تكون اللعبة محلولة.</li></ul>",

gYukon:"يوكون",
rulesY:"<h3>الهدف</h3><p>أفرغ <b>الهرم</b> كله (28 ورقة).</p><h3>الطريقة</h3><p>أزل <b>زوجًا من الأوراق مجموعه 13</b>: الآص=1، الولد=11، الملكة=12. مثلًا 6+7، 4+9، ملكة+آص. <b>الملك</b> (13) يخرج وحده.</p><p>الورقة المتاحة فقط هي التي <b>لا تغطيها أي ورقة أخرى</b>. يمكنك أيضًا المزاوجة مع الورقة العليا في الكومة بجانب الرزمة.</p><p>المس ورقة لإزالتها مع أفضل شريك لها. تريد الاختيار؟ اسحبها إلى شريكها.</p><h3>الرزمة</h3><p>المس لكشف ورقة. يمكنك المرور على الرزمة <b>ثلاث مرات</b>.</p>",
rulesTP:"<h3>الهدف</h3><p>أفرغ <b>القمم الثلاث</b> (28 ورقة).</p><h3>الطريقة</h3><p>انقل إلى الكومة المكشوفة ورقة <b>أعلى بواحد أو أدنى بواحد</b> منها، من أي نوع. الملك والآص يتصلان. تنكشف الورقة عندما لا تغطيها أوراق أخرى.</p><p>لا توجد حركة؟ المس الرزمة لكشف ورقة جديدة (دورة واحدة فقط).</p><h3>النقاط</h3><p>كل ورقة في السلسلة تساوي أكثر: الأولى 1، الثانية 2، الثالثة 3... ورقة من الرزمة تُصفّر السلسلة. إفراغ كل القمم: مكافأة 50.</p>",
rulesGO:"<h3>الهدف</h3><p>أفرغ <b>الأعمدة السبعة</b> (35 ورقة، كلها مكشوفة).</p><h3>الطريقة</h3><p>انقل الورقة <b>السفلى</b> من عمود إلى الكومة إذا كانت <b>أعلى بواحد أو أدنى بواحد</b> من ورقة الكومة، من أي نوع. <b>لا يوضع شيء على الملك</b>، والملك والآص لا يتصلان.</p><p>لا توجد حركة؟ المس الرزمة لكشف ورقة (دورة واحدة فقط).</p><h3>النقاط</h3><p>كما في الغولف — الأقل أفضل. نتيجتك هي عدد الأوراق المتبقية على الطاولة.</p>",
rulesCF:"<h3>الهدف</h3><p>انقل كل الأوراق إلى <b>الأساسات الأربعة</b>.</p><h3>الترتيب</h3><p><b>احتياطي</b> من 13 ورقة (العليا فقط مكشوفة)، و4 أعمدة، وورقة واحدة تُكشف على الأساس الأول — <b>هي التي تحدد قيمة البداية</b>. إذا كانت 7، يبدأ كل أساس من 7 ويصعد: 7، 8... ملك، آص، 2... حتى 6.</p><h3>الطاولة</h3><p>رتّب <b>تنازليًا بألوان متناوبة</b>؛ وبعد الآص يأتي الملك. العمود الذي يفرغ يمتلئ تلقائيًا من الاحتياطي. عندما ينفد الاحتياطي، يمكن وضع أي ورقة في العمود الفارغ.</p><h3>الرزمة</h3><p>اكشف ثلاثًا (أو واحدة)، مع دورات غير محدودة.</p>",
rulesYU:"<h3>الهدف</h3><p>انقل كل الأوراق إلى <b>الأساسات الأربعة</b>، حسب النوع من الآص إلى الملك.</p><h3>الطاولة</h3><p>7 أعمدة كما في كلوندايك، لكن <b>بلا رزمة</b> — كل الأوراق على الطاولة من البداية. رتّب <b>تنازليًا بألوان متناوبة</b>.</p><p>الميزة: يمكنك نقل <b>أي ورقة مكشوفة مع كل الأوراق التي فوقها</b> — حتى لو لم تكن مرتبة. العمود الفارغ يقبل الملك فقط (مع ما فوقه).</p>",

rulesRU:"<h3>الهدف</h3><p>نقل كل الأوراق إلى <b>القواعد الأربع</b> حسب النوع من الآس إلى الملك.</p><h3>الطاولة</h3><p>الترتيب نفسه كما في يوكون: 7 أعمدة بلا رزمة. لكن البناء <b>تنازلي وبالنوع نفسه</b> — 9♥ فقط على 10♥.</p><p>يمكن تحريك <b>أي ورقة مكشوفة مع كل الأوراق التي فوقها</b> حتى لو لم تكن مرتبة. العمود الفارغ لا يقبل إلا ملكًا.</p><p>💡 لعبة صعبة جدًا — أبقِ خيار «توزيعات قابلة للفوز فقط» مفعّلًا.</p>",
rulesSC:"<h3>الهدف</h3><p>بناء <b>أربع سلاسل كاملة</b> على الطاولة — من الملك إلى الآس بالنوع نفسه. السلسلة المكتملة تصعد وحدها.</p><h3>الترتيب</h3><p>7 أعمدة في كل منها 7 أوراق. في الأعمدة الأربعة الأولى تكون الأوراق الثلاث السفلى مقلوبة. وتنتظر 3 أوراق أخرى في الرزمة.</p><h3>الطاولة</h3><p>توضع الورقة فقط على ورقة <b>أعلى منها بواحد ومن النوع نفسه</b>. كما في يوكون، يمكن تحريك <b>أي ورقة مكشوفة مع كل ما فوقها</b>. العمود الفارغ لا يقبل إلا ملكًا.</p><h3>الأوراق الثلاث</h3><p>اضغط على الرزمة لتوزيعها على الأعمدة الثلاثة الأولى — مرة واحدة فقط.</p>",
rulesFT:"<h3>الهدف</h3><p>نقل الأوراق الـ104 كلها إلى <b>القواعد الثماني</b> حسب النوع من الآس إلى الملك.</p><h3>الطاولة</h3><p>10 أعمدة في كل منها 4 أوراق مكشوفة. ابنِ <b>تنازليًا وبالنوع نفسه</b> وحرّك <b>ورقة واحدة في كل مرة</b>. عند وجود أعمدة فارغة يمكن تحريك سلسلة كاملة (كل عمود فارغ يضاعف الطول). العمود الفارغ يقبل أي ورقة.</p><h3>الرزمة</h3><p>الضغط يكشف ورقة واحدة. تمرّ على الرزمة <b>مرة واحدة فقط</b> — لا دورة ثانية.</p>",
rulesBD:"<h3>الهدف</h3><p>نقل كل الأوراق إلى <b>القواعد الأربع</b> حسب النوع من الآس إلى الملك.</p><h3>الطاولة</h3><p>13 عمودًا في كل منها 4 أوراق، كلها مكشوفة. عند التوزيع <b>تنزل الملوك إلى أسفل</b> أعمدتها.</p><p>ابنِ <b>تنازليًا بغض النظر عن النوع</b> وحرّك الورقة العليا فقط. <b>العمود الذي يفرغ يبقى فارغًا</b> — لا يمكن ملؤه.</p><p>💡 ابدأ بالأعمدة التي تكون فيها الآسات أقل عمقًا.</p>",
rulesCL:"<h3>الهدف</h3><p>كشف الأوراق الـ52 كلها قبل خروج الملك الرابع.</p><h3>الترتيب</h3><p>12 كومة حول ساعة — الآس عند الواحدة، و2 عند الثانية وهكذا حتى الملكة عند الثانية عشرة — وكومة الملوك في الوسط. في كل كومة 4 أوراق مقلوبة.</p><h3>اللعب</h3><p>تأتي الورقة الأولى من الوسط. ضعها <b>تحت كومة رقمها</b> (اضغط على الورقة أو على الكومة)، ومن هناك تأتي الورقة التالية. استمر حتى يدخل الملك الرابع.</p><p>لا قرارات هنا — إنها حظ خالص، وتنجح تقريبًا لعبة واحدة من كل 13. <b>▶ لعب تلقائي</b> يشغّل كل شيء.</p>",

/* ---- table.js ---- */
/* =====================================================================
   SolitaireNest — the table: deals, layout, input (tap = smart move · drag + magnet), undo, hint,
   auto-up, auto-finish, timer, win celebration and result, stats, daily deal.
   G (saved on every change): { g, opt, S (engine state), hist [snapshots], el (ms played), started,
                                daily (yyyy-mm-dd or null), counted, undos, hints, k (stats key) }
   ===================================================================== */
let G = LS.get('game', null);
const saveGame = () => LS.set('game', G);
const GAME_KEYS = ['klondike', 'freecell', 'spider', 'pyramid', 'tripeaks', 'golf', 'canfield', 'yukon', 'russian', 'scorpion', 'fortythieves', 'bakers', 'clock'];
const MW_GAMES = ['russian', 'scorpion', 'bakers'];          // games with a "winnable deals only" list (tools/msolve.js)
const GICON = { klondike: '🂡', freecell: '🗝️', spider: '🕷️', pyramid: '🔺', tripeaks: '⛰️', golf: '⛳', canfield: '🎩', yukon: '❄️', russian: '🪆', scorpion: '🦂', fortythieves: '🗡️', bakers: '🥖', clock: '🕰️' };
const NOSCORE = ['freecell', 'yukon', 'russian', 'scorpion', 'fortythieves', 'bakers', 'clock'];
const GNAME = g => T('g' + g[0].toUpperCase() + g.slice(1));
let RECT = {}, LAY = null, BUSY = false, FIN = null, IDLE = 0;

const GM = () => SOL.GAMES[G.S.g];
function statKey(g, opt) { return g === 'klondike' ? 'klondike' + (opt.draw || 1) : g === 'spider' ? 'spider' + (opt.suits || 1) : g === 'canfield' ? 'canfield' + (opt.draw === 1 ? 1 : 3) : g; }
function gameTitle(g, opt) {
  if (g === 'klondike') return T('gKlondike') + ' · ' + T(opt.draw === 3 ? 'draw3' : 'draw1');
  if (g === 'spider') return T('gSpider') + ' · ' + T('suitsN', opt.suits || 1);
  if (g === 'canfield') return T('gCanfield') + ' · ' + T(opt.draw === 1 ? 'draw1' : 'draw3');
  return GNAME(g);
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayIndex = s => Math.floor(Date.parse(s + 'T12:00:00Z') / 864e5);

/* ---------- deals ---------- */
function pickSeed(g, opt) {
  if (g === 'klondike' && ST.kWin && typeof KWIN !== 'undefined') { const L = KWIN[opt.draw === 3 ? 3 : 1]; if (L && L.length) return L[Math.floor(Math.random() * L.length)]; }
  if (MW_GAMES.includes(g) && wOnly(g) && typeof MWIN !== 'undefined') { const L = MWIN[g]; if (L && L.length) return L[Math.floor(Math.random() * L.length)]; }
  return 1 + Math.floor(Math.random() * 2e9);
}
const wOnly = g => !ST.wOnly || ST.wOnly[g] !== false;   // on unless switched off
function newDeal(g, opt, seed, daily, race) {
  opt = Object.assign({}, opt);
  if (g === 'klondike' && !race) Object.assign(opt, { limit: ST.kLimit, scoring: daily ? 'std' : ST.kScore });
  if (seed == null) seed = pickSeed(g, opt);
  const S = SOL.GAMES[g].deal(seed, opt);
  if (g === 'klondike' && opt.scoring === 'vegas') { ST.vegasBank = (ST.vegasBank || 0) - 52; saveST(); }
  G = { g, opt, S, hist: [], el: 0, started: false, daily: daily || null, race: race || null, counted: false, undos: 0, hints: 0, k: statKey(g, opt), seed };
  const st = LS.get('stats', {}), b = st[G.k] || (st[G.k] = blankStat()); b.played++; LS.set('stats', st);
  IDLE = 0; clearTimeout(FIN); FIN = null;
  saveGame(); RECT = {}; DEALING = true; show('game'); beep('shuffle');
  setTimeout(() => { DEALING = false; }, 900);
}
function dailyDeal() {
  const d = today(), L = (typeof KWIN !== 'undefined' && KWIN[1]) || [1];
  const seed = L[((dayIndex(d) % L.length) + L.length) % L.length];
  newDeal('klondike', { draw: 1 }, seed, d);
}
function restartDeal() { if (!G) return; const { g, opt, seed, daily, race } = G; G.counted = true; newDeal(g, race ? opt : { draw: opt.draw, suits: opt.suits }, seed, daily, race); }
const blankStat = () => ({ played: 0, won: 0, best: 0, bestMoves: 0, streak: 0, bestStreak: 0, time: 0, score: 0 });

/* ---------- acting (every action is one undo step, including the cards that went up by themselves) ---------- */
const snap = () => JSON.stringify({ p: G.S.p, moves: G.S.moves, score: G.S.score, passes: G.S.passes, won: G.S.won });
function pushHist() { G.hist.push(snap()); if (G.hist.length > 400) G.hist.splice(0, G.hist.length - 400); }
function doMove(from, i, to) {
  if (!G || G.S.won || BUSY) return false;
  const g = GM(); if (!g.canDrop(G.S, from, i, to)) { beep('err'); return false; }
  pushHist();
  const ev = g.move(G.S, from, i, to) || {};
  G.started = true; IDLE = 0;
  beep(to[0] === 'f' ? 'up' : 'card'); if (ev.runs) { beep('run'); buzz(30); }
  autoUps(); after(); return true;
}
function doStock() {
  if (!G || G.S.won || BUSY) return;
  const g = GM(), before = snap(), r = g.stock(G.S);
  if (r === 'empty') { toast(T('spiderEmptyCol')); beep('err'); return; }
  if (!r) { beep('err'); if (G.S.g === 'klondike' && G.S.p.w.length) toast(T('noMoreRedeals')); return; }
  G.hist.push(before); if (G.hist.length > 400) G.hist.shift();
  G.started = true; IDLE++;
  beep(r === 'recycle' ? 'shuffle' : 'flip');
  autoUps(); after();
}
function autoUps() {
  if (!ST.autoUp || G.S.g === 'spider') return;
  const g = GM(); for (let n = 0; n < 60; n++) { const m = g.safeUp(G.S); if (!m) break; g.move(G.S, m.from, m.i, m.to); }
}
function undo() {
  if (!G || !G.hist.length || BUSY || G.S.won) return;
  clearTimeout(FIN); FIN = null;
  const o = JSON.parse(G.hist.pop()); Object.assign(G.S, o); G.undos++; IDLE = 0;
  beep('undo'); saveGame(); renderGame();
}
function after() {
  const S = G.S;
  if (S.won && !G.counted) { saveGame(); renderGame(); if (G.race) raceProgress(); win(); return; }
  if (G.race) raceProgress();
  saveGame(); renderGame();
  if (!S.won && ST.autoFinish && !GM().finishStep && GM().canFinish(S) && !FIN) FIN = setTimeout(autoFinish, 450);
  // going round the stock with nothing else to do → say so once

/* =====================================================================

/* who won: the first to finish; if both finished, the shorter playing time; giving up loses */
function decide() {

  if (w == null) return;

  const st = LS.get('stats', {}), b = st.race || (st.race = { played: 0, won: 0 }); b.played++; if (w === 0) b.won++; LS.set('stats', st);
  if (w === 1) { beep('lose'); if (!G.S.won) banner('🏁 ' + T('xFinished', RC.names[1])); }

  const KEYS = [['klondike1', T('gKlondike') + ' · ' + T('draw1')], ['klondike3', T('gKlondike') + ' · ' + T('draw3')], ['freecell', T('gFreecell')], ['spider1', T('gSpider') + ' · ' + T('suitsN', 1)], ['spider2', T('gSpider') + ' · ' + T('suitsN', 2)], ['spider4', T('gSpider') + ' · ' + T('suitsN', 4)], ['pyramid', T('gPyramid')], ['tripeaks', T('gTripeaks')], ['golf', T('gGolf')], ['canfield3', T('gCanfield') + ' · ' + T('draw3')], ['canfield1', T('gCanfield') + ' · ' + T('draw1')], ['yukon', T('gYukon')], ...['russian', 'scorpion', 'fortythieves', 'bakers', 'clock'].map(k => [k, GNAME(k)])];
  for (const [k, lab] of KEYS) {
    const b = S[k]; if (!b || !b.played) continue;
    h += '<div class="card"><h3 class="gh"><img src="img/g-' + k.replace(/\d/g, '') + '.webp" alt="">' + esc(lab) + '</h3><table class="tbl">' +
      '<tr><td>' + esc(T('gamesWon')) + '</td><td>' + iso(NF(b.won) + ' / ' + NF(b.played)) + '</td><td>' + pct(b.won, b.played) + '</td></tr>' +
      (b.best ? '<tr><td>' + esc(T('bestT')) + '</td><td>' + fmtT(b.best * 1000) + '</td><td></td></tr>' : '') +
      (b.won ? '<tr><td>' + esc(T('avgT')) + '</td><td>' + fmtT(b.time / b.won * 1000) + '</td><td></td></tr>' : '') +
      (b.bestMoves ? '<tr><td>' + esc(T('bestMoves')) + '</td><td>' + num(b.bestMoves) + '</td><td></td></tr>' : '') +
      '<tr><td>' + esc(T('streak')) + '</td><td>' + num(b.streak) + '</td><td>' + esc(T('bestStreakN', NF(b.bestStreak))) + '</td></tr>' +
      (b.score ? '<tr><td>' + esc(T('bestScore')) + '</td><td>' + num(b.score) + '</td><td></td></tr>' : '') + '</table></div>';
  }
  const D = LS.get('daily', {}), nd = Object.keys(D).length;
  if (nd) h += '<div class="card"><h3>📅 ' + esc(T('daily')) + '</h3><table class="tbl"><tr><td>' + esc(T('dailyCount')) + '</td><td>' + num(nd) + '</td></tr><tr><td>' + esc(T('streak')) + '</td><td>' + num(dailyStreak()) + '</td></tr></table></div>';
  $('#statBody').innerHTML = h || '<div class="card"><p>' + esc(T('noStats')) + '</p><button class="btn main" id="stPlay" style="width:100%">' + esc(T('gKlondike')) + '</button></div>';
  if ($('#stPlay')) $('#stPlay').onclick = () => setupBox('klondike');
}

/* ---------- rules ---------- */
function renderRules(g) {
  g = g || 'klondike';
  const tabs = '<div class="rtabs" id="rTabs">' + GAME_KEYS.map(k => '<button data-g="' + k + '" class="' + (g === k ? 'on' : '') + '">' + GICON[k] + ' ' + esc(GNAME(k)) + '</button>').join('') + '</div>';
  const ex = cs => '<div class="ex">' + cs.map(c => cardHTML(c)).join('') + '</div>';
  const body = g === 'klondike' ? T('rulesK1') + ex([12, 37, 10, 22]) + T('rulesK2') : g === 'freecell' ? T('rulesF1') + ex([9, 34, 7]) + T('rulesF2') : g === 'spider' ? T('rulesS1') + ex([12, 11, 10, 9]) + T('rulesS2') :
    g === 'pyramid' ? T('rulesY') + ex([5, 20, 12]) : g === 'tripeaks' ? T('rulesTP') + ex([7, 21, 9]) : g === 'golf' ? T('rulesGO') + ex([4, 18, 30]) : g === 'canfield' ? T('rulesCF') + ex([12, 26, 50]) : g === 'yukon' ? T('rulesYU') + ex([25, 10, 47]) :
    g === 'russian' ? T('rulesRU') + ex([25, 24, 23]) : g === 'scorpion' ? T('rulesSC') + ex([51, 50, 49]) : g === 'fortythieves' ? T('rulesFT') + ex([9, 8, 7]) : g === 'bakers' ? T('rulesBD') + ex([12, 24, 36]) : T('rulesCL') + ex([0, 13, 26, 39]);
  $('#rulesBody').innerHTML = tabs + body + T('rulesCommon');
  $$('#rTabs [data-g]').forEach(b => b.onclick = () => renderRules(b.dataset.g));
}

/* ---------- about ---------- */
function renderAbout() {
  $('#aboutBody').innerHTML = '<div style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="font-family:var(--disp);font-weight:400;margin:8px 0 0">SolitaireNest · ' + esc(T('appName')) + '</h2><div class="muted">' + esc(T('tagline')) + '</div></div>' +
    '<div class="card" style="margin-top:14px"><table class="tbl" style="text-align:start"><tr><td>' + esc(T('version')) + '</td><td>' + APP_VERSION + '</td></tr><tr><td>' + esc(T('developer')) + '</td><td>Barak Aflalo</td></tr><tr><td>' + esc(T('platform')) + '</td><td>PWA · HTML5</td></tr><tr><td>' + esc(T('storage')) + '</td><td>' + esc(T('storageVal')) + '</td></tr><tr><td>' + esc(T('license')) + '</td><td>' + iso('© AppNest 2026') + '</td></tr></table></div>' +
    '<div class="row"><a class="btn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener">🏪 ' + esc(T('store')) + '</a><button class="btn" id="aShare">📤 ' + esc(T('shareApp')) + '</button></div>' +
    '<div class="row" style="margin-top:10px"><a class="btn" href="mailto:appnest55@gmail.com?subject=SolitaireNest%20' + APP_VERSION + '">✉️ ' + esc(T('feedback')) + '</a><button class="btn" id="aTour">🧭 ' + esc(T('tourAgain')) + '</button></div>' +
    '<div class="row" style="margin-top:10px"><a class="btn" href="privacy_policy.html" target="_blank">🔒 ' + esc(T('privacy')) + '</a><button class="btn" id="aRules">📖 ' + esc(T('rules')) + '</button></div>' +
    '<div class="card" style="margin-top:14px"><h3>' + esc(T('diag')) + '</h3><p class="muted" style="direction:ltr;text-align:left;font-size:12px;word-break:break-all">' + esc('v' + APP_VERSION + ' · ' + navigator.userAgent.slice(0, 120) + ' · SW:' + ('serviceWorker' in navigator)) + '</p>' + (ERRS.length ? '<p class="muted" style="direction:ltr;text-align:left;font-size:12px">' + ERRS.map(e => esc(e.t.slice(5, 16) + ' ' + e.m)).join('<br>') + '</p>' : '<p class="muted">' + esc(T('noErrors')) + '</p>') + '</div>';
  $('#aShare').onclick = async () => { const d = { title: 'SolitaireNest', text: T('shareText'), url: location.origin + location.pathname }; try { if (navigator.share) await navigator.share(d); else { await navigator.clipboard.writeText(d.url); toast(T('copied')); } } catch (e) {} };
  $('#aTour').onclick = () => tour(true);
  $('#aRules').onclick = () => { renderRules(); RULES_BACK = 'about'; show('rules'); };
}

/* ---------- first-run tour ---------- */
function tour(force) {
  if (!force && ST.tutDone) return;
  const steps = [['🃏', 'tour1t', 'tour1'], ['👆', 'tour2t', 'tour2'], ['↶', 'tour3t', 'tour3'], ['📅', 'tour4t', 'tour4']];
  let i = 0;
  const o = overlay('<div class="tut" id="tutB"></div>', 'center'); o.dataset.lock = '1';
  function draw() {
    const [ic, t, b] = steps[i];
    $('#tutB').innerHTML = '<div class="big">' + ic + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(b)) + '</p><div class="dots">' + steps.map((_, j) => '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div><div class="row"><button class="btn ghosty" data-k="skip">' + esc(T('skip')) + '</button><button class="btn main" data-k="next">' + esc(i === steps.length - 1 ? T('letsPlay') : T('next')) + '</button></div>';
  }
  o.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (!k) return; if (k.dataset.k === 'next' && i < steps.length - 1) { i++; draw(); return; } ST.tutDone = true; saveST(); closeOv(o); });
  draw();
}

/* ---------- init ---------- */
function init() {
  applyLook(); applyLang(); bindGame(); bindVoice();
  $$('[data-home]').forEach(b => b.onclick = () => {
    if (b.closest('#rules') && RULES_BACK !== 'home') { const t = RULES_BACK; RULES_BACK = 'home'; show(t); return; }
    if (b.closest('#settings') && SET_BACK !== 'home') { SET_BACK = 'home'; show('game'); return; }
    show('home'); renderHome();
  });
  $('#hTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast('🎨 ' + T('theme')); };
  $('#hMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  $('#hLang').onclick = () => { const ks = Object.keys(LANGS); ST.lang = ks[(ks.indexOf(ST.lang) + 1) % ks.length]; saveST(); renderHome(); toast(LANGS[ST.lang]); };
  $('#hAbout').onclick = () => { renderAbout(); show('about'); };
  $('#hRules').onclick = () => { renderRules(); RULES_BACK = 'home'; show('rules'); };
  $('#hStats').onclick = () => { renderStats(); show('stats'); };
  $('#hSettings').onclick = () => { renderSettings(); SET_BACK = 'home'; show('settings'); };
  $('#mDaily').onclick = () => {
    const D = LS.get('daily', {});
    if (G && G.daily === today() && !G.S.won) { show('game'); return; }
    if (D[today()]) { toast(T('dailyAlready'), 3000); }
    const go = () => { lostStreak(); dailyDeal(); };
    if (G && G.started && !G.S.won && G.daily !== today()) confirmBox(T('newDealQ'), T('daily'), go); else go();
  };
  $('#mCont').onclick = () => { if (G) show('game'); };
  $('#mRace').onclick = () => openLobby();
  if (G && (!G.S || !SOL.GAMES[G.S.g])) { G = null; saveGame(); }
  raceResume();
  renderHome();
  $$('#games [data-g]').forEach(b => b.onclick = () => setupBox(b.dataset.g));
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) {
    const q2 = new URLSearchParams(location.search); q2.delete('join'); history.replaceState(null, '', location.pathname + (q2.toString() ? '?' + q2 : ''));
    ST.tutDone = true; saveST();
    if (RC) { show('lobby'); renderLobby(); }
    else if (!ST.name) { openLobby(); $('#lCode').value = jc.toUpperCase(); toast(T('enterName'), 4000); }
    else openLobby(jc);
  } else tour(false);
  if (location.protocol === 'file:') toast(T('fileWarn'), 6000);
  const q = new URLSearchParams(location.search);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);

</script>
